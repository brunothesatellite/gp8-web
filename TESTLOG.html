# TESTLOG.md — Journal de test d'écoute (validation humaine)

> **Objet** : valider **à l'oreille** les correctifs audio/synchro du plan
> `BUGFIX-TOTAL.md` (phases **P2, P3, P4, P6**). Ce journal est **vierge** : il
> est pré-rempli avec les morceaux, les **mesures/repères précis** à observer et
> les critères attendus ; les colonnes *Relevé / Verdict* sont à remplir.
>
> **Référence du plan** : `BUGFIX-TOTAL.md` §5.2 (les 15 points d'écoute) et
> §5.3 (journal). Ce fichier est la version **opérationnelle** à remplir.

---

## 0. Ce qui est déjà prouvé automatiquement (ne pas re-tester sans doute)

| Invariant | Preuve |
|---|---|
| `playbackSpeed` **jamais écrit en lecture** (⇒ 0 coupure de synthé) | banc **15/15** + navigateur réel **15/15** |
| 0 erreur console | navigateur **15/15** |
| dérive de croisière bornée par la zone morte | **10-80 ms** (navigateur), **≤ 11 ms** (banc) |
| anacrouses alignées sur l'audio | **6/6 ≤ 0,04 %** |
| fin de webapp **jamais** au-delà du MP3 | **15/15** |
| `node tools/test-all.js` | **8/8**, exit 0 |

**Question posée à l'oreille** : le **ressenti** (timbre, « colle » MIDI↔MP3,
nature des sauts, transitions de tempo). Les chiffres disent *« pas de
régression mesurée »* ; l'oreille dit *« c'est bon à jouer »*.

**Piège à éviter** : sur **ACDC, Renaud et The Offspring**, il existe des écarts
**donnée GP** documentés (clés de synchro « H2 »). Ce sont des **désaccords du
fichier `.gp` lui-même**, pas des défauts de la webapp. Ne les signaler que s'ils
produisent un **saut parasite** (voir les zones listées par fiche).

---

## 1. Mode d'emploi

1. Une **fiche par morceau** (§5). Remplir le tableau *spécifique*, la ligne
   *grille commune*, la ligne *console*, le *verdict* et les *notes*.
2. Écouter chaque morceau **en entier une fois** (contrôle global), puis faire
   les **réécoutes ciblées** indiquées (contrôle local).
3. Noter pour toute anomalie : **l'horodatage** (mm:ss) et la **mesure**.
4. Cocher ensuite la **synthèse** (§7) et remplir le **journal des anomalies** (§8).

## 2. Vocabulaire & barème

| Verdict | Définition |
|---|---|
| **✅ conforme** | aucun écart perceptible |
| **🟡 conforme avec réserve** | écart audible mais **non bloquant** (≤ seuil machine ou gênant à peine) |
| **❌ défaut** | écart **audible bloquant** : coupure, saut parasite, décalage franc, transition ratée, erreur console |
| **?** | doute — à re-tester (noter l'horodatage) |

**Seuils machine pour interpréter la console** (contexte) :
- `playbackSpeed` écrit **0×** en lecture ;
- dérive de croisière < **40 ms** (toléré 🟡 jusqu'à ~100 ms, zone morte) ;
- **0** erreur console ;
- `[oracle] … résidu H2` **normal et attendu** sur ACDC / Renaud / Offspring.

## 3. Environnement de test (à préparer une fois)

- [ ] Serveur local : `python -m http.server 8777 --bind 127.0.0.1` → ouvrir
      `http://localhost:8777/` (ou `deploy/start.bat`).
- [ ] Navigateur **Chrome/Edge**, **casque** (la phase fine s'entend au casque).
- [ ] Mode **mix** (MIDI **+** MP3), volume MIDI ≈ volume audio.
- [ ] Vitesse **×1,0**.
- [ ] **Console ouverte** (F12) — recopier les lignes `[mix]`, `[mix-stats]`,
      `[oracle]` dans chaque fiche.
- [ ] Version testée : commit `__________` · Navigateur/OS : `__________`
      · Date : `__________`

## 4. Grille commune (définie une fois, appliquée à chaque morceau)

| Id | Critère | Ce qu'on écoute |
|---|---|---|
| **T1** | Tempo | le MIDI suit-il le **tempo de l'enregistrement** sur toute la durée ? |
| **T2** | Phase | MIDI et MP3 restent-ils **collés** (pas de flam, pas de traîne) ? |
| **T3** | Continuité | aucune **coupure** de synthé / note hachée / trou ? |
| **T4** | Renvois & reprises | passages dans le **bon ordre** et le **bon nombre** ? |
| **T5** | Sauts | un **seul** saut net par discontinuité voulue, **0 saut parasite** ? |
| **T6** | Fin de morceau | fin webapp = fin du MP3 (ni troncature, ni dépassement) ? |
| **T7** | Console | **0 erreur** ; dérive `[mix-stats]` ; `[oracle]` ; `[mix]` cohérents ? |

### Contrôles transverses

- **X1 — Vitesse utilisateur** (sur **Iron Maiden, Dr. Stein, AC/DC,
  Offspring**) : pendant la lecture, passer **×0,5 puis ×1,5** → le moteur doit
  composer vitesse × tempo pré-cuit **sans trou ni décalage**.
  → X1 : ☐ conforme ☐ réserve ☐ défaut · notes : ______________________
- **X2 — Isolation A/B** (si un artefact persiste) : couper la **piste audio**
  → s'il persiste ⇒ **MIDI** ; couper le **master MIDI** → s'il persiste ⇒
  **MP3** ; ne subsiste que séparément ⇒ **causes cumulatives**.
  → X2 : non requis ☐ · résultat : ______________________

}
function renderSynth(r){
  if (r.verdict === r.init.verdict && r.reserve === r.init.reserve && r.date === r.init.date) return r.raw;
  var q = r.p.slice();
  q[3] = ' ' + (r.verdict || '') + ' ';
  q[4] = ' ' + (r.reserve || '') + ' ';
  q[5] = ' ' + (r.date || '') + ' ';
  return q.join('|');
}
function reproCell(v){ return ' ' + (v === 'oui' ? CHK_ON : CHK) + ' oui ' + (v === 'non' ? CHK_ON : CHK) + ' non '; }
function gravCell(v){
  return ' ' + ['bloquant', 'majeur', 'mineur'].map(function(g){
    return (v === g ? CHK_ON : CHK) + ' ' + g; }).join(' ') + ' ';
}
function renderAnomaly(r){
  if (r.song === r.init.song && r.time === r.init.time && r.measure === r.init.measure &&
      r.desc === r.init.desc && r.repro === r.init.repro && r.path === r.init.path &&
      r.gravity === r.init.gravity) return r.raw;
  var q = r.p.slice();
  q[2] = ' ' + (r.song || '') + ' ';
  q[3] = ' ' + (r.time || '') + ' ';
  q[4] = ' ' + (r.measure || '') + ' ';
  q[5] = ' ' + (r.desc || '') + ' ';
  q[6] = reproCell(r.repro);
  q[7] = ' ' + (r.path || '') + ' ';
  q[8] = gravCell(r.gravity);
  return q.join('|');
}
function renderCampaign(){
  var c = model.campaign; if (!c) return null;
  if (c.val === c.init) return c.raw;
  var o = [['valid\u00e9e', '**valid\u00e9e**'], ['r\u00e9serves', 'valid\u00e9e **avec r\u00e9serves**'],
           ['d\u00e9fauts', '**d\u00e9fauts \u00e0 corriger**']];
  return '**D\u00e9cision de campagne** : ' + o.map(function(x){
    return (c.val === x[0] ? CHK_ON : CHK) + ' ' + x[1]; }).join(' \u00b7 ');
}
function renderTester(){
  var t = model.tester; if (!t) return null;
  if (t.tester === t.init.tester && t.date === t.init.date) return t.raw;
  return '**Testeur** : ' + (t.tester || '______________') + ' **Date** : ' + (t.date || '____ / ____ / ______');
}

function serializeLines(){
  if (!model) return state.lines.slice();
  var out = state.lines.slice();
  var i, j;
  for (i = 0; i < model.prep.length; i++){
    var rp = renderPrep(model.prep[i]);
    out[model.prep[i].li] = rp.main;
    if (rp.date && model.prep[i].dateLi >= 0) out[model.prep[i].dateLi] = rp.date;
  }
  for (i = 0; i < model.songs.length; i++){
    var s = model.songs[i];
    if (s.grid) out[s.grid.li] = renderGrid(s);
    if (s.console) out[s.console.li] = renderConsole(s);
    if (s.verdict) out[s.verdict.li] = renderVerdict(s);
    if (s.notes) out[s.notes.li] = renderNotes(s);
    for (j = 0; j < s.rows.length; j++) out[s.rows[j].li] = renderRow(s.rows[j]);
  }
  var x1 = renderX1(); if (x1 !== null && model.x1) out[model.x1.li] = x1;
  var x2 = renderX2(); if (x2 !== null && model.x2) out[model.x2.li] = x2;
  if (model.synthesis) for (i = 0; i < model.synthesis.rows.length; i++)
    out[model.synthesis.rows[i].li] = renderSynth(model.synthesis.rows[i]);
  if (model.anomalies) for (i = 0; i < model.anomalies.rows.length; i++)
    out[model.anomalies.rows[i].li] = renderAnomaly(model.anomalies.rows[i]);
  var ca = renderCampaign(); if (ca !== null && model.campaign) out[model.campaign.li] = ca;
  var te = renderTester(); if (te !== null && model.tester) out[model.tester.li] = te;
  return out;
}
function serialize(){ return serializeLines().join(state.eol); }

/* ---------------------- rendering (form) ---------------------- */
var VERD_OPTS = ['', '\u2705', '\ud83d\udfe1', '\u274c', '?'];
var VERD_LABEL = { '': '\u2014', '\u2705': '\u2705 ok', '\ud83d\udfe1': '\ud83d\udfe1 r\u00e9serve',
                   '\u274c': '\u274c d\u00e9faut', '?': '? doute' };
var GRID_OPTS = [CHK, '\u2705', '\u274c'];

function verdictSelect(act, song, row, val, cls){
  var opts = VERD_OPTS.slice();
  if (val && opts.indexOf(val) < 0) opts.push(val);
  var h = '<select class="verd' + (cls ? ' ' + cls : '') + '" data-act="' + act + '" data-song="' + song +
          '" data-row="' + row + '">';
  opts.forEach(function(o){
    h += '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' +
         esc(VERD_LABEL[o] || o) + '</option>';
  });
  return h + '</select>';
}
function gridSelect(song, i, val){
  var opts = GRID_OPTS.slice(); if (val && opts.indexOf(val) < 0) opts.push(val);
  var h = '<select data-act="grid" data-song="' + song + '" data-i="' + i + '">';
  opts.forEach(function(o){
    h += '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>';
  });
  return h + '</select>';
}

function songHTML(s, idx){
  var badge = s.verdict && s.verdict.val
    ? '<span class="badge v">' + esc(s.verdict.val) + '</span>'
    : '<span class="badge">\u2014</span>';

  var h = '<details class="song" data-song="' + idx + '"' + (s.open ? ' open' : '') + '>' +
          '<summary>5.' + s.num + ' \u00b7 ' + esc(s.title) + badge + '</summary><div class="songbody">';

  h += '<div class="ctx">';
  if (s.file) h += 'Fichier : <b>' + esc(s.file) + '</b><br>';
  if (s.angle) h += 'Angle : ' + mdInline(s.angle) + '<br>';
  if (s.machine) h += 'Machine : ' + mdInline(s.machine);
  h += '</div>';

  if (s.rows.length){
    h += '<table class="ft"><thead><tr><th>#</th><th>Rep\u00e8re</th><th>O\u00f9</th><th>Attendu</th>' +
         '<th>Relev\u00e9</th><th>Verdict</th></tr></thead><tbody>';
    s.rows.forEach(function(r, ri){
      var c = cellsOf(r.raw);
      h += '<tr><td class="n">' + esc((c[0] || '').trim()) + '</td>' +
           '<td class="rep">' + mdInline((c[1] || '').trim()) + '</td>' +
           '<td>' + mdInline((c[2] || '').trim()) + '</td>' +
           '<td class="attendu">' + mdInline((c[3] || '').trim()) + '</td>' +
           '<td><input type="text" data-act="rowreleve" data-song="' + idx + '" data-row="' + ri +
               '" value="' + esc(r.releve) + '" placeholder="relev\u00e9\u2026"></td>' +
           '<td>' + verdictSelect('rowverdict', idx, ri, r.verdict, '') + '</td></tr>';
    });
    h += '</tbody></table>';
  }

  if (s.grid){
    h += '<div class="grid"><span class="lbl">Grille commune :</span>';
    for (var k = 0; k < 7; k++) h += '<label>T' + (k + 1) + gridSelect(idx, k, s.grid.vals[k]) + '</label>';
    h += '</div>';
  }
  if (s.console){
    h += '<div class="line"><span class="lbl">[mix]</span>' +
         '<input type="text" data-act="console" data-song="' + idx + '" data-f="mix" value="' + esc(s.console.mix) + '">' +
         '<span class="lbl">d\u00e9rive max ([mix-stats])</span>' +
         '<input type="text" class="num" data-act="console" data-song="' + idx + '" data-f="drift" value="' + esc(s.console.drift) + '">' +
         '<span class="lbl">ms</span>' +
         '<span class="lbl">[oracle]</span>' +
         '<input type="text" data-act="console" data-song="' + idx + '" data-f="oracle" value="' + esc(s.console.oracle) + '"></div>';
  }
  if (s.verdict){
    h += '<div class="line"><span class="lbl">Verdict morceau</span><span class="vbtns">';
    ['\u2705', '\ud83d\udfe1', '\u274c', '?'].forEach(function(v){
      h += '<button class="vbtn' + (s.verdict.val === v ? ' on' : '') + '" data-act="verdict" data-song="' + idx +
           '" data-val="' + v + '">' + v + '</button>';
    });
    h += '<button class="vbtn' + (!s.verdict.val ? ' on' : '') + '" data-act="verdict" data-song="' + idx + '" data-val="">\u2014</button>';
    h += '</span><span class="lbl">Anomalie(s) n\u00b0</span>' +
         '<input type="text" data-act="verdictanom" data-song="' + idx + '" value="' + esc(s.verdict.anom) + '"></div>';
  }
  if (s.notes){
    h += '<div class="line"><span class="lbl">Notes</span></div>' +
         '<textarea data-act="notes" data-song="' + idx + '" rows="2" placeholder="notes libres\u2026">' + esc(s.notes.val) + '</textarea>';
  }
  return h + '</div></details>';
}

    model.synthesis.rows.forEach(function(r, i){
      h += '<tr><td class="n">' + esc((r.p[1] || '').trim()) + '</td><td>' + mdInline(r.label) + '</td>' +
           '<td>' + verdictSelect('synthverdict', 0, i, r.verdict, '') + '</td>' +
           '<td><input type="text" data-act="synthreserve" data-row="' + i + '" value="' + esc(r.reserve) + '"></td>' +

      [['valid\u00e9e', 'valid\u00e9e'], ['r\u00e9serves', 'avec r\u00e9serves'], ['d\u00e9fauts', 'd\u00e9fauts \u00e0 corriger'], ['', '\u2014']].forEach(function(v){

           '</select></td></tr>';
    });
    h += '</tbody></table>' + dl + '<button class="add" data-act="addanom">+ Ajouter une anomalie</button></section>';

function refresh(){
  if (!model) return;
  var done = model.songs.filter(function(s){ return s.verdict && s.verdict.val; }).length;
  var total = model.songs.length || 15;
  document.getElementById('barfill').style.width = Math.round(100 * done / total) + '%';
  document.getElementById('progtext').textContent = done + '/' + total + ' fiches conclues';
  document.getElementById('preview').textContent = serialize();
}

/* ---------------------- events ---------------------- */
var app = document.getElementById('app');

app.addEventListener('input', function(e){
  var t = e.target, act = t.dataset && t.dataset.act; if (!act || !model) return;
  var s = +t.dataset.song, r = +t.dataset.row, i = +t.dataset.i;
  switch (act){
    case 'rowreleve':    model.songs[s].rows[r].releve = t.value; break;
    case 'rowverdict':   model.songs[s].rows[r].verdict = t.value; break;
    case 'grid':         model.songs[s].grid.vals[i] = t.value; break;
    case 'console':      model.songs[s].console[t.dataset.f] = t.value; break;
    case 'verdictanom':  model.songs[s].verdict.anom = t.value; break;
    case 'notes':        model.songs[s].notes.val = t.value; break;
    case 'prep':         model.prep[i].checked = t.checked; break;
    case 'commit':       model.prep.filter(function(p){ return p.isVersion; })[0].commit = t.value; break;
    case 'nav':          model.prep.filter(function(p){ return p.isVersion; })[0].nav = t.value; break;
    case 'vdate':        model.prep.filter(function(p){ return p.isVersion; })[0].date = t.value; break;
    case 'x1notes':      model.x1.notes = t.value; break;
    case 'x2na':         model.x2.na = t.checked; break;
    case 'x2result':     model.x2.result = t.value; break;
    case 'synthreserve': model.synthesis.rows[r].reserve = t.value; break;
    case 'synthdate':    model.synthesis.rows[r].date = t.value; break;
    case 'synthverdict': model.synthesis.rows[r].verdict = t.value; break;
    case 'anomsong':     model.anomalies.rows[r].song = t.value; break;
    case 'anomtime':     model.anomalies.rows[r].time = t.value; break;
    case 'anommeasure':  model.anomalies.rows[r].measure = t.value; break;
    case 'anomdesc':     model.anomalies.rows[r].desc = t.value; break;
    case 'anomrepro':    model.anomalies.rows[r].repro = t.value; break;
    case 'anompath':     model.anomalies.rows[r].path = t.value; break;
    case 'anomgrav':     model.anomalies.rows[r].gravity = t.value; break;
    case 'campaign':     model.campaign.val = t.value; break;
    case 'tester':       model.tester.tester = t.value; break;
    case 'testerdate':   model.tester.date = t.value; break;
    default: return;
  }
  refresh();
});

app.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t || !model) return;
  var act = t.dataset.act, s = +t.dataset.song;
  if (act === 'verdict'){ model.songs[s].verdict.val = t.dataset.val; render(); }
  else if (act === 'x1'){ model.x1.verdict = t.dataset.val; render(); }
  else if (act === 'campaign'){ model.campaign.val = t.dataset.val; render(); }
  else if (act === 'addanom'){ addAnomaly(); }
  else if (act === 'addsong'){ addSong(); }
});

app.addEventListener('toggle', function(e){
  var d = e.target.closest('details.song'); if (!d || !model) return;
  model.songs[+d.dataset.song].open = d.open;
}, true);

/* ---------------------- structural edits ---------------------- */
function applyToLines(){ state.lines = serializeLines(); }
function nextAnomalyN(){
  var mx = 0; model.anomalies.rows.forEach(function(r){ var v = parseInt(r.n, 10); if (v > mx) mx = v; });
  return mx + 1;
}
function addAnomaly(){
  applyToLines();
  var line = '| ' + nextAnomalyN() + ' | | | | | ' + CHK + ' oui ' + CHK + ' non | | ' +
             CHK + ' bloquant ' + CHK + ' majeur ' + CHK + ' mineur |';
  state.lines.splice(model.anomalies.lastLi + 1, 0, line);
  parse(state.lines.join(state.eol));
  var last = model.anomalies.rows[model.anomalies.rows.length - 1];
  if (last) last.raw = line; // force re-render editable
  render();
  var inputs = document.querySelectorAll('[data-act="anomsong"]');
  if (inputs.length) inputs[inputs.length - 1].focus();
}
function addSong(){
  var title = prompt('Titre de la fiche (ex. "AC/DC \u2014 Thunderstruck") :');
  if (!title) return;
  var file = prompt('Nom du fichier .gp :', '') || '';
  applyToLines();
  var n = model.songs.length + 1;
  var block = [
    '### 5.' + n + ' \u00b7 ' + title,
    '`' + file + '`',
    '**Angle** : ',
    '**Machine** : ',
    '',
    '| # | Rep\u00e8re | O\u00f9 (mesure) | Attendu | Relev\u00e9 | Verdict |',
    '|---|---|---|---|---|---|',
    '| 1 | | | | | |',
    '',
    '**Grille commune** : T1 ' + CHK + ' \u00b7 T2 ' + CHK + ' \u00b7 T3 ' + CHK + ' \u00b7 T4 ' + CHK +
      ' \u00b7 T5 ' + CHK + ' \u00b7 T6 ' + CHK + ' \u00b7 T7 ' + CHK,
    '**Console** : `[mix]` ' + U12 + ' \u00b7 d\u00e9rive max `[mix-stats]` ' + U6 + ' ms \u00b7 `[oracle]` ' + U12,
    '**Verdict morceau** : ' + CHK + ' \u2705 ' + CHK + ' \ud83d\udfe1 ' + CHK + ' \u274c ' + CHK + ' ? \u2014 **Anomalie(s)** n\u00b0 ' + U12,
    '**Notes** : ' + U12,
    '',
    '---',
    ''
  ];
  var at = -1;
  for (var i = 0; i < state.lines.length; i++) if (/^##\s+6\./.test(state.lines[i])) { at = i; break; }
  if (at < 0) at = state.lines.length;
  state.lines.splice(at, 0, block.join('\n'));
  parse(state.lines.join(state.eol));
  var lastSong = model.songs[model.songs.length - 1];
  if (lastSong) lastSong.open = true;
  render();
}

function setStatus(msg, cls){
  var el = document.getElementById('status');
  el.textContent = msg || ''; el.className = 'status' + (cls ? ' ' + cls : '');
}
function setMode(){
  document.getElementById('mode').textContent = state.handle
    ? 'mode : écriture en place (' + state.fileName + ')'
    : 'mode : l\u2019export ouvrira une bo\u00eete \u00ab Enregistrer \u00bb';
}
function setSource(src){
  document.getElementById('source').textContent = src ? 'source : ' + src : '';
}
/* mémoire du navigateur : permet l'ouverture en double-clic (file://) déjà remplie */
function lsSave(text){
  try { localStorage.setItem(LS_KEY, JSON.stringify({ md: text, at: new Date().toISOString() })); } catch (e) {}
}
function lsLoad(){
  try {
    var v = localStorage.getItem(LS_KEY); if (!v) return null;
    var o = JSON.parse(v); return (o && o.md) ? o : null;
  } catch (e) { return null; }
}
function load(text, name, handle, source){
  state.fileName = name || 'TESTLOG.md';
  state.handle = handle || null;
  parse(text);
  lsSave(text);
  setMode();
  setSource(source || '');
  setStatus('Charg\u00e9 (' + model.songs.length + ' fiches).', 'ok');
  render();
}

document.getElementById('btnOpen').addEventListener('click', async function(){
  if (window.showOpenFilePicker){
    try {
      var hs = await window.showOpenFilePicker({ multiple: false,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] });
      var f = await hs[0].getFile();
      load(await f.text(), f.name, hs[0], 'fichier import\u00e9 (' + f.name + ')');
      return;
    } catch (err){ if (err && err.name === 'AbortError') return; }
  }
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){ load(rd.result, f.name, null, 'fichier import\u00e9 (' + f.name + ')'); };
  rd.readAsText(f);
});

document.getElementById('btnReset').addEventListener('click', function(){
  if (!state.original) return;
  if (!confirm('Recharger le fichier d\u2019origine et perdre les saisies non export\u00e9es ?')) return;
  parse(state.original); render();
  setStatus('Fichier recharg\u00e9.', 'ok');
});

async function writeOut(text){
  if (state.handle){
    var w = await state.handle.createWritable();
    await w.write(text); await w.close();
    return 'inplace';
  }
  if (window.showSaveFilePicker){
    var h = await window.showSaveFilePicker({ suggestedName: state.fileName || 'TESTLOG.md',
      types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] });
    var w2 = await h.createWritable();
    await w2.write(text); await w2.close();
    state.handle = h; setMode();
    return 'inplace';
  }
  var blob = new Blob([text], { type: 'text/markdown' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = state.fileName || 'TESTLOG.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  return 'download';
}

async function doExport(){
  if (!model){ setStatus('Aucun fichier charg\u00e9.', 'bad'); return; }
  var txt = serialize();
  var done = model.songs.filter(function(s){ return s.verdict && s.verdict.val; }).length;
  var msg = 'Exporter les r\u00e9sultats vers ' + state.fileName + ' ?\n\n' +
            '\u2022 ' + done + '/' + model.songs.length + ' fiches conclues\n' +
            '\u2022 les zones non \u00e9dit\u00e9es sont recopi\u00e9es \u00e0 l\u2019identique\n' +
            '\u2022 le fichier cible sera \u00c9CRAS\u00c9' +
            (state.handle ? '' : '\n\u2022 une bo\u00eete \u00ab Enregistrer \u00bb va s\u2019ouvrir : choisissez TESTLOG.md');
  if (!confirm(msg)) return;
  try {
    var how = await writeOut(txt);
    lsSave(txt);
    if (state.htmlHandle){
      try { var hw = await state.htmlHandle.createWritable(); await hw.write(buildHtml(txt)); await hw.close(); }
      catch (e) { /* le .md est écrit : la synchro HTML pourra être refaite */ }
    }
    setStatus(how === 'inplace' ? '\u2705 \u00c9crit dans ' + state.fileName
                                : '\u2705 T\u00e9l\u00e9charg\u00e9 (' + state.fileName + ')', 'ok');
  } catch (err){
    if (err && err.name === 'AbortError'){ setStatus('Export annul\u00e9.', ''); return; }
    setStatus('Erreur export : ' + (err && err.message ? err.message : err), 'bad');
  }
}
document.getElementById('btnExport').addEventListener('click', doExport);
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); doExport(); }
});

/* Synchro : réécrit TESTLOG.html avec TESTLOG.md embarqué (ouvrir en double-clic) */
function buildHtml(md){
  var clone = document.documentElement.cloneNode(true);
  var app = clone.querySelector('#app'); if (app) app.innerHTML = '';
  var prev = clone.querySelector('#preview'); if (prev) prev.textContent = '';
  var seed = clone.querySelector('#seed-testlog');
  if (seed) seed.textContent = '\n' + String(md).replace(/\s+$/, '') + '\n';
  return '<!DOCTYPE html>\n' + clone.outerHTML + '\n';
}
async function syncHtml(){
  if (!model){ setStatus('Aucun fichier charg\u00e9.', 'bad'); return; }
  var md = serialize();
  if (!confirm('R\u00e9\u00e9crire TESTLOG.html avec le contenu de TESTLOG.md embarqu\u00e9 ?\n\n' +
               'La page s\u2019ouvrira alors d\u00e9j\u00e0 remplie en double-clic (file://).')) return;
  var html = buildHtml(md);
  try {
    var h = state.htmlHandle;
    if (!h && window.showSaveFilePicker){
      h = await window.showSaveFilePicker({ suggestedName: 'TESTLOG.html',
        types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] });
      state.htmlHandle = h;
    }
    if (h){
      var w = await h.createWritable(); await w.write(html); await w.close();
      setStatus('\u2705 TESTLOG.html synchronis\u00e9 (mises \u00e0 jour automatiques ensuite).', 'ok');
    } else {
      var blob = new Blob([html], { type: 'text/html' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'TESTLOG.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      setStatus('\u2705 TESTLOG.html t\u00e9l\u00e9charg\u00e9.', 'ok');
    }
  } catch (err){
    if (err && err.name === 'AbortError'){ setStatus('Synchronisation annul\u00e9e.', ''); return; }
    setStatus('Erreur sync : ' + (err && err.message ? err.message : err), 'bad');
  }
}
document.getElementById('btnSync').addEventListener('click', syncHtml);

/* ---- chargement par défaut, en cascade ---- */
function seedText(){
  var el = document.getElementById('seed-testlog');
  if (!el) return '';
  var t = el.textContent || '';
  if (t.indexOf(SEED_SENTINEL) >= 0) return '';   // placeholder non régénéré
  t = t.replace(/^\s*\n/, '').replace(/\s+$/, '');
  return t ? t + '\n' : '';
}
async function boot(){
  /* 1. le fichier TESTLOG.md du même dossier — possible seulement servi en http(s) :
        un navigateur interdit la lecture d'un fichier voisin depuis file:// */
  if (/^https?:$/.test(location.protocol)){
    try {
      var r = await fetch('TESTLOG.md', { cache: 'no-store' });
      if (r.ok){
        var t = await r.text();
        if (t.trim()){ load(t, 'TESTLOG.md', null, 'TESTLOG.md (dossier)'); return; }
      }
    } catch (e) { /* serveur absent : on continue */ }
  }
  /* 2. mémoire du navigateur : dernier état ouvert ou exporté */
  var ls = lsLoad();
  if (ls && ls.md && ls.md.trim()){ load(ls.md, 'TESTLOG.md', null, 'm\u00e9moire du navigateur'); return; }
  /* 3. copie embarquée dans TESTLOG.html */
  var s = seedText();
  if (s){ load(s, 'TESTLOG.md', null, 'copie embarqu\u00e9e'); return; }
  render();
}

/* drag & drop */
document.addEventListener('dragover', function(e){ e.preventDefault(); });
document.addEventListener('drop', function(e){
  e.preventDefault();
  var f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){ load(rd.result, f.name, null, 'fichier d\u00e9pos\u00e9 (' + f.name + ')'); };
  rd.readAsText(f);
});

boot();

/* hook de test (round-trip) */
window.__testlog = {
  load: function(t, n){ load(t, n || 'TESTLOG.md', null, 'test'); },
  serialize: function(){ return serialize(); },
  parse: parse,
  buildHtml: buildHtml,
  seedText: seedText,
  model: function(){ return model; },
  state: state
};
</script>
