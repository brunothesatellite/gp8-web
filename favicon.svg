<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="GP8 Player">
  <title>GP8 Player</title>
  <defs>
    <!-- plaque de fond : même gris ardoise que l'interface (slate-950) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <!-- médiator : ciel -> bleu profond, identique au dégradé de la barre de titre -->
    <linearGradient id="pick" x1="32" y1="10" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#bae6fd"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="1"    stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- plaque arrondie : lisible aussi sur un onglet clair -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- médiator de guitare (symétrique par rapport à x=32) -->
  <path d="M32 55
           C40.5 47.5 48.5 37.5 50.5 28.5
           C52.5 19 44 12 32 12
           C20 12 11.5 19 13.5 28.5
           C15.5 37.5 23.5 47.5 32 55 Z"
        fill="url(#pick)"/>

  <!-- reflet : donne la matière « plastique » du médiator, visible dès 32 px -->
  <path d="M21 19.5 C23.5 16.8 26.6 15.2 30 14.6"
        fill="none" stroke="#e0f2fe" stroke-opacity="0.55"
        stroke-width="2.4" stroke-linecap="round"/>
</svg>
